# The release gate: the heavy checks that gate a release candidate and never a commit or a pull request.
# Run it by hand on the candidate commit; every step must pass before a deploy.
name: release gate

on:
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: proofs, vectors, mutation, and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise x -- just check
      - name: Check the Lean proofs with the pinned toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: proofs
          use-github-cache: true
      - name: Regenerate the conformance vectors and refuse drift
        run: |
          lake -d proofs exe vectors proofs/vectors
          test -z "$(git status --porcelain -- proofs/vectors)" || { git status --short -- proofs/vectors; exit 1; }
      - run: mise x -- just mutation
      - run: mise x -- just e2e
