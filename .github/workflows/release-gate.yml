# The release gate: the heavy checks that gate a release candidate and never a commit or a pull request.
# Run it by hand on the candidate commit; every step must pass before a deploy.
name: release gate

on:
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: proofs, vectors, mutation, and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise x -- just check
      - name: Check the Lean proofs with the pinned toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: proofs
          use-github-cache: true
      - name: Regenerate the conformance vectors and refuse drift
        run: |
          lake -d proofs exe vectors proofs/vectors
          git diff --exit-code -- proofs/vectors
      - run: mise x -- just mutation
      - run: mise x -- just e2e
