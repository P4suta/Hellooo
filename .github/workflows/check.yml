# The fast gate on every change: the same `just check` a developer runs, on one pinned Linux runner.
# One summary job is the required check; heavy checks live in release-gate.yml.
name: check

on:
  pull_request:
  merge_group:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise x -- just check

  summary:
    name: summary
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the check job to have passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
